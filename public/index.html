<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boozo Bingo — Halloween Bar Crawl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>" />
</head>
<body>
  <main>

  <!-- ── SHARE-LINK JOIN SCREEN (shown when URL has ?join=CODE) ─────────── -->
  <div id="screen-join-link" class="screen">
    <div class="join-link-glow"></div>
    <div class="join-link-content">
      <div class="logo">
        <span class="logo-icon">🎃</span>
        <h1>Boozo Bingo</h1>
        <p class="tagline">Halloween Bar Crawl Edition</p>
      </div>
      <div class="card form-card">
        <p class="join-link-intro">You've been invited to join a room!</p>
        <div class="input-group">
          <label for="join-name">Your Name</label>
          <input id="join-name" type="text" placeholder="e.g. Ghostface" maxlength="20" autocomplete="off" />
        </div>
        <button id="btn-join-link" class="btn btn-primary btn-lg">Join Room 🎃</button>
        <p id="join-link-error" class="error-msg"></p>
      </div>
    </div>
  </div>

  <!-- ── HOME SCREEN ─────────────────────────────────────────────────── -->
  <div id="screen-home" class="screen">
    <div class="home-glow"></div>
    <div class="home-content">
      <div class="logo">
        <span class="logo-icon">🎃</span>
        <h1>Boozo Bingo</h1>
        <p class="tagline">Halloween Bar Crawl Edition</p>
      </div>
      <div class="card form-card">
        <div class="input-group">
          <label for="home-name">Your Name</label>
          <input id="home-name" type="text" placeholder="e.g. Ghostface" maxlength="20" autocomplete="off" aria-describedby="home-name-error" />
          <p id="home-name-error" class="error-msg" role="alert"></p>
        </div>
        <div class="home-actions">
          <button id="btn-create" class="btn btn-primary">Create Room</button>
          <div class="divider"><span>or join existing</span></div>
          <div class="join-row">
            <input id="home-code" type="text" placeholder="Room Code" maxlength="5" autocomplete="off" />
            <button id="btn-join" class="btn btn-secondary">Join</button>
          </div>
        </div>
        <p id="home-error" class="error-msg" role="alert"></p>
      </div>
    </div>
  </div>

  <!-- ── LOBBY SCREEN ────────────────────────────────────────────────── -->
  <div id="screen-lobby" class="screen">
    <h1 class="sr-only">Waiting room</h1>
    <div class="lobby-header">
      <button id="btn-lobby-leave" class="btn btn-ghost btn-sm">← Leave</button>
      <h2>Waiting Room</h2>
      <div></div>
    </div>
    <div class="lobby-content">
      <div class="room-code-box">
        <p class="room-code-label">Room Code</p>
        <div class="room-code-display" id="lobby-code"></div>
        <div class="room-code-actions">
          <button id="btn-copy-code" class="btn btn-ghost btn-sm">📋 Copy</button>
          <button id="btn-share-link" class="btn btn-ghost btn-sm">🔗 Share Link</button>
        </div>
      </div>
      <div class="players-section">
        <p class="players-label">Players (<span id="lobby-player-count">1</span>)</p>
        <ul id="lobby-player-list" class="player-list"></ul>
      </div>
      <div class="lobby-actions">
        <!-- Card size selector (host only, shown before game starts) -->
        <div class="card-size-selector" id="card-size-selector">
          <p class="players-label">Card Size</p>
          <div class="card-size-options">
            <button class="card-size-btn" data-size="3x3">3×3</button>
            <button class="card-size-btn active" data-size="5x5">5×5</button>
          </div>
        </div>
        <button id="btn-start" class="btn btn-primary btn-lg">🎃 Start Game</button>
        <p id="lobby-error" class="error-msg"></p>
      </div>
    </div>
  </div>

  <!-- ── GAME SCREEN ─────────────────────────────────────────────────── -->
  <div id="screen-game" class="screen">
    <h1 class="sr-only">Your bingo card</h1>
    <div class="game-header">
      <div class="game-header-left">
        <button id="btn-game-leave" class="btn btn-ghost btn-sm">← Leave</button>
      </div>
      <div class="game-header-center">
        <div class="room-code-mini" id="game-room-code"></div>
      </div>
      <div class="game-header-right">
        <button id="btn-mark-bingo" class="btn btn-primary btn-sm" style="display:none">🎃 I got BINGO</button>
        <button id="btn-new-card" class="btn btn-ghost btn-sm">🔄 New Card</button>
      </div>
    </div>
    <div class="game-body">
      <div class="bingo-card-wrapper">
        <div class="bingo-card" id="bingo-card"></div>
      </div>
      <div class="game-sidebar">
        <div class="sidebar-section">
          <p class="sidebar-label">Players</p>
          <ul id="game-player-list" class="player-list player-list-sm"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- ── WINNER ALERT (in-game, dismissible) ─────────────────────────── -->
  <div id="winner-alert" class="winner-alert" style="display:none">
    <div class="winner-alert-inner">
      <span class="winner-alert-emoji">👻</span>
      <div class="winner-alert-text">
        <strong id="winner-alert-name"></strong> got BINGO!
      </div>
      <button id="btn-dismiss-winner" class="btn btn-primary btn-sm">Keep playing</button>
    </div>
    <canvas id="confetti-canvas"></canvas>
  </div>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
