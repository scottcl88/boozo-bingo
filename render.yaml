services:
  - name: boozo-bingo
    runtime: node
    region: oregon
    plan: free
    # Deploy only after the GitHub CI checks for the commit pass (blueprint-managed services).
    autoDeployTrigger: checksPass
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: PORT
        value: "10000"
